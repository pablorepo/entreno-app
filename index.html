<!doctype html><html lang=es><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Entrenamiento</title>
<meta name=theme-color content="#000"><link rel=manifest href=manifest.json><link rel=apple-touch-icon href=icon.svg><meta name=apple-mobile-web-app-capable content=yes>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font:24px/1.35 system-ui,sans-serif}#app{padding:18px;max-width:600px;margin:auto}
h1{font-size:40px;margin:8px 0}h2{font-size:34px;margin:8px 0;color:#ffd400}p{margin:12px 0}
button,.big,input{font:inherit}.big{display:block;width:100%;min-height:88px;font-size:30px;font-weight:700;margin:12px 0;border:3px solid #ffd400;border-radius:18px;background:#1a1a1a;color:#fff;text-align:center;text-decoration:none;line-height:82px}
.acc{background:#ffd400;color:#000}.vid{background:#c00;border-color:#c00}.mid{flex:1;min-height:76px;font-size:26px;font-weight:700;border-radius:16px;border:2px solid #888;background:#222;color:#fff;margin:6px 0;width:100%}
.row{display:flex;gap:12px}.small{background:none;border:none;color:#aaa;font-size:22px;text-decoration:underline;padding:16px 0;width:100%}.danger{color:#ff6b6b}
input{width:100%;min-height:76px;font-size:30px;padding:8px 16px;margin:8px 0;border-radius:14px;border:3px solid #888;background:#111;color:#fff}.code{font-size:48px;letter-spacing:10px;text-align:center}
.chk{display:flex;align-items:center;gap:14px;font-size:24px}.chk input{width:40px;min-height:40px}
.wk{font-size:52px;font-weight:800;color:#ffd400;text-align:center;margin:20px 0}.obj{font-size:28px;text-align:center}.today{font-size:30px;text-align:center}
.sr{font-size:60px;font-weight:800;text-align:center}.info{font-size:28px}.note{font-size:22px;color:#ddd;border-left:6px solid #ffd400;padding-left:12px}
.muted{color:#bbb}.c{text-align:center}.lastkg{font-size:48px;color:#fff;display:block;text-align:center}.err{color:#ff6b6b;font-weight:700;min-height:1em}
.kgrow{display:flex;gap:10px;align-items:center}.pm{width:96px;height:96px;font-size:56px;font-weight:800;border-radius:18px;border:none;background:#ffd400;color:#000;flex:none}.kg{font-size:56px;font-weight:800;text-align:center;flex:1}
.meta{width:150px;min-height:60px;display:inline-block}.qr{background:#fff;padding:10px;border-radius:12px}.qr svg{width:100%;height:auto}.key{font-size:26px;font-family:monospace;word-break:break-all;color:#ffd400}
.list{font-size:28px;padding-left:24px}table{width:100%;border-collapse:collapse;font-size:20px}td,th{border:1px solid #444;padding:6px}td:not(:first-child),th{text-align:center;font-weight:700}
</style></head><body><div id=app></div><script src=app.js></script></body></html>
